name: Validate reference library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate data and generated files
        run: |
          python3 scripts/build.py
          git diff --exit-code
          python3 scripts/validate.py
          python3 -m unittest discover -s tests
      - run: npm ci --ignore-scripts
      - name: Test CLI and file retrieval with Tester Army
        env:
          E2E_TELEMETRY_DISABLED: '1'
          TASTE_LIBRARY_BASE_URL: http://127.0.0.1:8766/
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/taste-library-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766/catalog/search.json', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('File server did not start')
          PY
          npm run test:e2e
